<text x="817" y="348" text-anchor="middle" class="tiny">0～3 px</text>

<path d="M 840,201 L 866,225" fill="none" stroke="#475569" stroke-width="1.3" marker-end="url(#arr)"/>
<path d="M 840,251 L 866,251" fill="none" stroke="#475569" stroke-width="1.3" marker-end="url(#arr)"/>
<path d="M 840,301 L 866,277" fill="none" stroke="#475569" stroke-width="1.3" marker-end="url(#arr)"/>

<!-- Mini Shift-Robustness Curve Plot inside Architecture Diagram! -->
<g transform="translate(876, 182)">
  <rect x="0" y="0" width="188" height="128" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <!-- Axes -->
  <line x1="28" y1="106" x2="176" y2="106" stroke="#334155" stroke-width="1.2"/>
  <line x1="28" y1="16" x2="28" y2="106" stroke="#334155" stroke-width="1.2"/>
  <!-- Gridlines -->
  <line x1="28" y1="36" x2="176" y2="36" stroke="#E2E8F0" stroke-width="0.8" stroke-dasharray="3,2"/>
  <line x1="28" y1="68" x2="176" y2="68" stroke="#E2E8F0" stroke-width="0.8" stroke-dasharray="3,2"/>
  <!-- Affine CNN curve (99.4 -> 99.4 -> 99.25 -> 98.87) stays high! -->
  <path d="M 38,24 L 82,25 L 126,28 L 166,34" fill="none" stroke="#2A7B6F" stroke-width="2.4"/>
  <circle cx="38" cy="24" r="3" fill="#2A7B6F"/><circle cx="82" cy="25" r="3" fill="#2A7B6F"/>
  <circle cx="126" cy="28" r="3" fill="#2A7B6F"/><circle cx="166" cy="34" r="3" fill="#2A7B6F"/>
  <!-- Plain CNN curve (99.45 -> 99.12 -> 97.72 -> 92.20) drops sharply! -->
  <path d="M 38,24 L 82,29 L 126,46 L 166,94" fill="none" stroke="#94A3B8" stroke-width="2.2" stroke-dasharray="4,2"/>
  <circle cx="38" cy="24" r="2.8" fill="#64748B"/><circle cx="82" cy="29" r="2.8" fill="#64748B"/>
  <circle cx="126" cy="46" r="2.8" fill="#64748B"/><circle cx="166" cy="94" r="2.8" fill="#64748B"/>
  <!-- Labels -->
  <text x="164" y="26" text-anchor="end" class="tiny" style="fill:#1B5E53;font-weight:700;">增强 98.87%</text>
  <text x="162" y="102" text-anchor="end" class="tiny" style="fill:#64748B;">原CNN 92.20%</text>
  <text x="102" y="121" text-anchor="middle" class="tiny">平移幅度 (0 → 3 px)</text>
  <text x="14" y="64" text-anchor="middle" class="tiny" transform="rotate(-90 14 64)">验证准确率</text>
</g>

