<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="490" viewBox="0 0 1180 490">

<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#334155"/>
  </marker>
  <marker id="arr-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#2A7B6F"/>
  </marker>
  <marker id="arr-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#C47D3B"/>
  </marker>
  <marker id="arr-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#94A3B8"/>
  </marker>
  <radialGradient id="priorGrad" cx="50%" cy="50%" r="52%">
    <stop offset="0%" stop-color="#FFF5D6"/>
    <stop offset="35%" stop-color="#F6B26B"/>
    <stop offset="72%" stop-color="#A66A9E"/>
    <stop offset="100%" stop-color="#4A3B6B"/>
  </radialGradient>
  <linearGradient id="stepGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#E2E8F0"/>
    <stop offset="100%" stop-color="#80B8AE"/>
  </linearGradient>
  <filter id="softShadow" x="-8%" y="-8%" width="118%" height="118%">
    <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0F172A" flood-opacity="0.07"/>
  </filter>
</defs>

<style>
  text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", "Times New Roman", sans-serif; fill: #1E293B; }
  .title { font-size: 19px; font-weight: 700; fill: #0F172A; }
  .sec { font-size: 13px; font-weight: 700; fill: #1E293B; }
  .lbl { font-size: 12px; font-weight: 700; fill: #1E293B; }
  .sub { font-size: 10.5px; fill: #475569; }
  .math { font-family: "Times New Roman", "Microsoft YaHei", serif; font-style: italic; font-size: 12.5px; fill: #0F172A; }
  .tiny { font-size: 9.5px; fill: #475569; }
  .wh { fill: #FFFFFF; font-weight: 700; }
</style>

<rect width="1180" height="490" fill="#FFFFFF"/>

<!-- Subtle Top Title -->
<text x="590" y="30" text-anchor="middle" class="title">四层卷积手写数字分类器：随机仿射增强、EMA 权重平滑与位移鲁棒性评测架构</text>

<!-- Left: Affine Augmentation Module -->
<rect x="26" y="155" width="218" height="196" rx="14" fill="#F8FAFC" stroke="#475569" stroke-width="1.6" stroke-dasharray="6,4"/>
<text x="135" y="180" text-anchor="middle" class="sec">随机仿射几何增强（训练期）</text>
<image href="data:image/png;base64," x="42" y="194" width="54" height="54"/>
<image href="data:image/png;base64," x="108" y="194" width="54" height="54"/>
<defs><clipPath id="d5c"><rect x="174" y="194" width="54" height="54"/></clipPath></defs>
<rect x="174" y="194" width="54" height="54" fill="#000000"/>
<image href="data:image/png;base64," x="179" y="190" width="54" height="54" clip-path="url(#d5c)"/>
<rect x="42" y="194" width="54" height="54" fill="none" stroke="#94A3B8" stroke-width="1"/>
<rect x="108" y="194" width="54" height="54" fill="none" stroke="#94A3B8" stroke-width="1"/>
<rect x="174" y="194" width="54" height="54" fill="none" stroke="#94A3B8" stroke-width="1"/>
<text x="69" y="263" text-anchor="middle" class="tiny">原图 28×28</text>
<text x="135" y="263" text-anchor="middle" class="tiny">旋转 ±12°</text>
<text x="201" y="263" text-anchor="middle" class="tiny">平移 ±2px</text>
<text x="135" y="287" text-anchor="middle" class="sub">网格缩放 0.90～1.10 · 双线性插值</text>
<text x="135" y="305" text-anchor="middle" class="sub">越界补黑背景值 black ≈ −0.424</text>
<rect x="52" y="317" width="166" height="22" rx="11" fill="#E6F4EA" stroke="#2A7B6F" stroke-width="1"/>
<text x="135" y="332" text-anchor="middle" class="tiny" style="fill:#1B5E53;font-weight:700;">验证集选中 · 替代原图基线</text>

<!-- Arrow into Input Slab -->
<path d="M 244,250 C 262,250 264,250 282,250" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)"/>

<!-- Top EMA Capsule -->
<rect x="405" y="64" width="276" height="44" rx="22" fill="#DCEBE2" stroke="#2A7B6F" stroke-width="1.6" filter="url(#softShadow)"/>
<text x="543" y="83" text-anchor="middle" class="sec" style="fill:#1B4332;">EMA 指数移动平均权重（对照支路）</text>
<text x="543" y="100" text-anchor="middle" class="tiny" style="fill:#2D6A4F;">θ̄ₜ = 0.995·θ̄ₜ₋₁ + 0.005·θₜ （有效窗口 ≈ 200 步）</text>

<!-- 3D Isometric CNN Backbone Cuboids -->
<!-- Input 1x28x28 -->
<polygon points="288,178 314,154 326,154 300,178" fill="#F1F5F9" stroke="#334155" stroke-width="1.4" stroke-linejoin="round"/><polygon points="300,178 326,154 326,320 300,344" fill="#CBD5E1" stroke="#334155" stroke-width="1.4" stroke-linejoin="round"/><polygon points="288,178 300,178 300,344 288,344" fill="#E2E8F0" stroke="#334155" stroke-width="1.4" stroke-linejoin="round"/>
<text x="307" y="366" text-anchor="middle" class="lbl">输入张量</text>
<text x="307" y="382" text-anchor="middle" class="sub">1×28×28</text>

<path d="M 326,252 L 352,252" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arr)"/>

<!-- Conv1-2: 32x28x28 -->
<polygon points="358,186 386,162 416,162 388,186" fill="#B4C5DF" stroke="#334155" stroke-width="1.4" stroke-linejoin="round"/><polygon points="388,186 416,162 416,312 388,336" fill="#7B92B4" stroke="#334155" stroke-width="1.4" stroke-linejoin="round"/><polygon points="358,186 388,186 388,336 358,336" fill="#93A8C8" stroke="#334155" stroke-width="1.4" stroke-linejoin="round"/>
<text x="387" y="366" text-anchor="middle" class="lbl">Conv1–2 + ReLU</text>
<text x="387" y="382" text-anchor="middle" class="sub">32×28×28 (3×3)</text>
<text x="387" y="397" text-anchor="middle" class="tiny">参数 9,568</text>

<path d="M 416,254 L 456,254" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="436" y="244" text-anchor="middle" class="tiny">Pool 2×2</text>

<!-- Conv3: 64x14x14 -->
<polygon points="462,212 488,190 534,190 508,212" fill="#B6D3C3" stroke="#334155" stroke-width="1.4" stroke-linejoin="round"/><polygon points="508,212 534,190 534,292 508,314" fill="#7EA691" stroke="#334155" stroke-width="1.4" stroke-linejoin="round"/><polygon points="462,212 508,212 508,314 462,314" fill="#97BCA8" stroke="#334155" stroke-width="1.4" stroke-linejoin="round"/>
<text x="498" y="344" text-anchor="middle" class="lbl">Conv3 + ReLU</text>
<text x="498" y="360" text-anchor="middle" class="sub">64×14×14 (3×3)</text>
<text x="498" y="375" text-anchor="middle" class="tiny">参数 18,496</text>

<path d="M 536,256 L 566,256" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arr)"/>

<!-- Conv4 + Pool: 64x7x7 -->
<polygon points="572,232 596,212 650,212 626,232" fill="#EFE0C5" stroke="#334155" stroke-width="1.4" stroke-linejoin="round"/><polygon points="626,232 650,212 650,280 626,300" fill="#C9AC7E" stroke="#334155" stroke-width="1.4" stroke-linejoin="round"/><polygon points="572,232 626,232 626,300 572,300" fill="#DFC59B" stroke="#334155" stroke-width="1.4" stroke-linejoin="round"/>
<text x="611" y="330" text-anchor="middle" class="lbl">Conv4 + Pool</text>
<text x="611" y="346" text-anchor="middle" class="sub">64×7×7 → 3,136</text>
<text x="611" y="361" text-anchor="middle" class="tiny">参数 36,928</text>

<path d="M 652,258 L 690,258" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arr)"/>

<!-- FC Neuron Column (128 -> 10) -->
<rect x="696" y="166" width="32" height="176" rx="14" fill="#F1F5F9" stroke="#334155" stroke-width="1.6"/>
<circle cx="712" cy="186" r="8" fill="#B8C7DC" stroke="#334155" stroke-width="1.2"/>
<circle cx="712" cy="212" r="8" fill="#B8C7DC" stroke="#334155" stroke-width="1.2"/>
