<circle cx="712" cy="328" r="7" fill="#97BCA8" stroke="#2A7B6F" stroke-width="1.2"/>
<text x="712" y="366" text-anchor="middle" class="lbl">全连接分类头</text>
<text x="712" y="382" text-anchor="middle" class="sub">3,136→128→10</text>
<text x="712" y="397" text-anchor="middle" class="tiny">Dropout(0.5) · 402.8k 参</text>

<!-- Curved Arrows from Conv Blocks up to EMA Capsule -->
<path d="M 386,162 C 392,132 422,124 446,110" fill="none" stroke="#475569" stroke-width="1.3" marker-end="url(#arr)"/>
<path d="M 498,190 C 500,152 512,138 525,110" fill="none" stroke="#475569" stroke-width="1.3" marker-end="url(#arr)"/>
<path d="M 610,212 C 610,164 595,142 580,110" fill="none" stroke="#475569" stroke-width="1.3" marker-end="url(#arr)"/>
<path d="M 681,86 C 722,86 716,126 712,162" fill="none" stroke="#2A7B6F" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-teal)"/>

<!-- Bottom backbone bracket -->
<path d="M 288,412 L 288,420 L 728,420 L 728,412" fill="none" stroke="#64748B" stroke-width="1.2"/>
<text x="508" y="440" text-anchor="middle" class="sec">共享四层 CNN 骨干（总参数 467,818 · 单图前向 37.38 MFLOPs · 交叉熵 + Adam 余弦退火 20 轮）</text>

<!-- Arrow from FC to Right Panel -->
<path d="M 730,256 C 752,256 754,256 774,256" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)"/>

<!-- Right: Inference Selection & Shift Robustness Evaluation Panel -->
<rect x="780" y="138" width="376" height="234" rx="14" fill="#FAFBFD" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="968" y="164" text-anchor="middle" class="sec">推理方式选型与位置平移鲁棒性评测</text>

<!-- Mini shifted digits -->
<image href="data:image/png;base64," x="798" y="182" width="38" height="38"/>
<image href="data:image/png;base64," x="798" y="232" width="38" height="38" transform="translate(3,0)"/>
